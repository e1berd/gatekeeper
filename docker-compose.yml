name: gatekeeper

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gatekeeper
      POSTGRES_PASSWORD: gatekeeper
      POSTGRES_DB: gatekeeper
      # Identity data must not be lost to a torn write.
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gatekeeper -d gatekeeper']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Rate-limit counters and permission caches are rebuildable, so no AOF.
    command: [
      'redis-server',
      '--save',
      '',
      '--appendonly',
      'no',
      '--maxmemory',
      '256mb',
      '--maxmemory-policy',
      'allkeys-lru',
    ]
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot: brings the schema up to date, then exits. The API waits for it.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: [
      'deno',
      'run',
      '--allow-net',
      '--allow-read',
      'packages/db/src/migrate.ts',
    ]
    volumes:
      - ./gatekeeper.yaml:/app/gatekeeper.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  gatekeeper:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./gatekeeper.yaml:/app/gatekeeper.yaml:ro
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'deno', 'eval', "await fetch('http://localhost:8080/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Dev only: S3-compatible avatar storage. In production point s3.endpoint at
  # your own S3/MinIO/R2 instead and drop these two services.
  rustfs:
    image: rustfs/rustfs:1.0.0
    command: ['rustfs', 'server', '/data', '--address', ':9000']
    environment:
      RUSTFS_ACCESS_KEY: gatekeeper
      RUSTFS_SECRET_KEY: gatekeeper-dev-secret
    volumes:
      - rustfs-data:/data
    ports:
      - '127.0.0.1:9000:9000'
    restart: unless-stopped
    profiles: ['dev']

  # Dev only: creates the avatar bucket and opens it for anonymous downloads.
  createbuckets:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: >
      /bin/sh -c "
      mc alias set gk http://rustfs:9000 gatekeeper gatekeeper-dev-secret &&
      mc mb --ignore-existing gk/gatekeeper-avatars &&
      mc anonymous set download gk/gatekeeper-avatars
      "
    depends_on:
      - rustfs
    restart: 'no'
    profiles: ['dev']

  # Dev only: catches every outgoing email at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '127.0.0.1:8025:8025'
    environment:
      MP_MAX_MESSAGES: 500
    restart: unless-stopped
    profiles: ['dev']

volumes:
  pgdata:
  rustfs-data:
