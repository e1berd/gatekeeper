server:
  port: 8080
  issuer: http://localhost:8080
  logLevel: info
  version: 0.1.0

database:
  url: postgres://gatekeeper:gatekeeper@postgres:5432/gatekeeper
  poolMax: 10

redis:
  url: redis://redis:6379

security:
  kek: CHANGE_ME_BASE64_32_BYTES
  signingKey: null

browser:
  cookieDomain: null
  allowedRedirectOrigins:
    - http://localhost:3000
    - http://localhost:8080
  allowedFormOrigins:
    - http://localhost:3000
  corsAllowedOrigins:
    - http://localhost:3000
  trustProxy: false

webauthn:
  rpId: localhost
  rpName: Gatekeeper
  origins:
    - http://localhost:3000
    - http://localhost:8080

# Gatekeeper is an SMTP client, never a mail server: point smtpUrl at the relay
# your provider gives you and leave delivery, SPF and DKIM to them.
mail:
  smtpUrl: smtp://mailpit:1025
  from: no-reply@gatekeeper.local

# Social sign-in. The endpoints for each provider are built in; a deployment
# supplies only credentials, and a provider with no entry here is refused.
# Redirect URI to register with the provider: <issuer>/oauth/<slug>/callback
oauth: {}
#  google:
#    clientId: ''
#    clientSecret: ''
#  github:
#    clientId: ''
#    clientSecret: ''

# Providers that prove identity with a payload they signed themselves, rather
# than with a redirect. `secret` is the key that signature is checked against —
# for Telegram, the bot token.
signedPayload: {}
#  telegram:
#    secret: ''
#    maxAgeSeconds: 86400

s3:
  endpoint: null
  region: us-east-1
  accessKeyId: ''
  secretAccessKey: ''
  avatarBucket: gatekeeper-avatars
  publicUrl: null
  pathStyle: true

humanVerification:
  provider: disabled
  actions: []
  hostnames: []
  timeoutMs: 5000
